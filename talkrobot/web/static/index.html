<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tyro TalkRobot</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="控制面板">
        <div class="brand">
          <img src="/static/tyro-mark.svg" alt="" class="brand-mark" />
          <div>
            <div class="brand-title">Tyro</div>
            <div class="brand-subtitle">TalkRobot UI</div>
          </div>
        </div>

        <section class="panel">
          <h2>会话</h2>
          <label>
            <span>用户</span>
            <input id="userInput" type="text" autocomplete="off" />
          </label>
          <label>
            <span>语言</span>
            <select id="languageSelect">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <label>
            <span>短期窗口</span>
            <input id="historyInput" type="number" min="0" max="50" step="1" />
          </label>
          <label class="switch-row">
            <span>长期记忆</span>
            <input id="memoryToggle" type="checkbox" />
          </label>
          <button id="clearHistoryBtn" class="secondary-button" type="button">
            清空短期上下文
          </button>
        </section>

        <section class="panel">
          <h2>手动记忆</h2>
          <textarea id="memoryText" rows="4" placeholder="写一条希望 Tyro 记住的信息"></textarea>
          <div class="button-row">
            <button id="addMemoryBtn" type="button">添加</button>
            <button id="loadMemoryBtn" class="secondary-button" type="button">查看</button>
          </div>
          <div id="memoryList" class="memory-list" aria-live="polite"></div>
        </section>
      </aside>

      <main class="chat-area">
        <header class="topbar">
          <div>
            <h1>Tyro 对话</h1>
            <p id="modelInfo">正在连接本地服务...</p>
          </div>
          <div id="statusPill" class="status-pill">待机</div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="avatar">
              <img src="/static/tyro-mark.svg" alt="" />
            </div>
            <div class="bubble">
              <div class="message-meta">Tyro</div>
              <p>你好，我已经在 Web 界面里醒着了。直接输入文字，我会带着短期上下文和长期记忆回复你。</p>
            </div>
          </article>
        </section>

        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="输入消息，Enter 发送，Shift + Enter 换行"
          ></textarea>
          <button id="sendBtn" type="submit" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.4 20.4 21 12 3.4 3.6l2.1 7.1 8.3 1.3-8.3 1.3-2.1 7.1Z" />
            </svg>
          </button>
        </form>
      </main>
    </div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
